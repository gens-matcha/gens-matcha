<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Collection — Gens Matcha × Natura</title>

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/img/star.png" />
  <meta name="theme-color" content="#FFFDF7" />
  <meta name="robots" content="noindex" />

  <style>
    @font-face{
      font-family:'Brandon Grotesque';
      src:url("/fonts/Gen's Matcha Regular.woff2") format('woff2');
      font-weight:400; font-style:normal; font-display:swap;
    }
    @font-face{
      font-family:'Brandon Grotesque';
      src:url("/fonts/Gen's Matcha Bold.woff2") format('woff2');
      font-weight:700; font-style:normal; font-display:swap;
    }

    /* Blues taken from the Natura wordmark (#8BD6EB), darkened for type. */
    :root{
      --cream:#FFFDF7;
      --blue-logo:#8BD6EB;
      --blue-deep:#1D6C89;
      --blue-mid:#4A9FBE;
      --blue-soft:#93BCCC;
      --line:#DCECF3;
      --tint:#EFF8FC;
    }

    *,*::before,*::after{ box-sizing:border-box }

    html,body{ height:100% }
    body{
      margin:0; background:var(--cream); color:var(--blue-deep);
      font:16px/1.5 'Brandon Grotesque', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      -webkit-font-smoothing:antialiased;
      overflow:hidden; user-select:none; -webkit-user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    .board{
      height:100dvh; display:flex; flex-direction:column;
      padding:22px 30px 12px;
    }

    header{ flex:0 0 auto; text-align:center; padding-bottom:22px }
    .logo{ max-height:164px; width:auto; max-width:88%; display:inline-block }

    .cols{
      flex:1 1 auto; min-height:0;
      display:grid; grid-template-columns:1fr 1fr;
    }
    .col{ display:flex; flex-direction:column; min-height:0; padding:0 28px }
    .col + .col{ border-left:1px solid var(--line) }

    .col-head{
      flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between;
      gap:12px; padding-bottom:9px; margin-bottom:22px;
      border-bottom:1px solid var(--line);
    }
    .col-head h2{
      margin:0; font-size:22px; font-weight:700;
      text-transform:uppercase; letter-spacing:.14em;
      color:var(--blue-deep);
    }
    .col--preparing .col-head h2{ color:var(--blue-mid) }
    .count{ font-size:15px; color:var(--blue-soft); font-variant-numeric:tabular-nums }

    /* A grid, not wrapped flex, so every number sits in an identical box —
       the wordmark's figures aren't tabular, so free-width chips came out
       uneven. */
    .nums{
      flex:1 1 auto; min-height:0; overflow-y:auto;
      display:grid; align-content:start; gap:14px;
      scrollbar-width:none;
    }
    .nums::-webkit-scrollbar{ display:none }
    .col--preparing .nums{ grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)) }
    .col--ready .nums{ grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)) }

    .num{
      display:flex; align-items:center; justify-content:center;
      font-weight:700; letter-spacing:.02em;
      border-radius:10px; animation:rise .4s ease backwards;
    }

    .col--preparing .num{
      padding:12px 8px;
      font-size:clamp(32px, 4.2vw, 54px);
      color:var(--blue-mid); background:var(--cream);
      border:1px solid var(--line);
    }
    .col--ready .num{
      padding:14px 8px;
      font-size:clamp(38px, 5.2vw, 66px);
      color:var(--cream); background:var(--blue-deep);
      border:1px solid var(--blue-deep);
    }

    .empty{
      flex:1 1 auto; display:none; flex-direction:column;
      align-items:center; justify-content:center; gap:12px;
      margin:0; padding-bottom:8%;
      color:var(--blue-soft); font-size:15px; text-align:center;
    }
    .empty img{ width:40px; height:auto; opacity:.5 }
    .is-empty .nums{ display:none }
    .is-empty .empty{ display:flex }

    footer{
      flex:0 0 auto; padding-top:10px; text-align:right;
      font-size:12px; color:var(--blue-soft); letter-spacing:.04em;
      min-height:22px;
    }
    .stale{ color:#B85C3C }

    @keyframes rise{ from{ opacity:0; transform:translateY(5px) } }
    @media (prefers-reduced-motion:reduce){ .num{ animation:none } }

    /* Portrait tablet: stack the two lists instead of squeezing them. */
    @media (orientation:portrait){
      .cols{ grid-template-columns:1fr; grid-template-rows:1fr 1fr }
      .col{ padding:0 4px }
      .col + .col{ border-left:0; border-top:1px solid var(--line); padding-top:20px; margin-top:18px }
      .logo{ max-height:120px }
    }
  </style>
</head>
<body>

  <div class="board">
    <header>
      <img class="logo" src="/img/Gen_Natura_Home.png" alt="Natura, a partnership with Gen's Matcha">
    </header>

    <main class="cols">
      <section class="col col--preparing is-empty" id="colPreparing">
        <div class="col-head">
          <h2>Preparing</h2>
          <span class="count" id="prepCount"></span>
        </div>
        <div class="nums" id="prepNums"></div>
        <p class="empty">
          <img src="/img/star.png" alt="">
          <span>nothing on the whisk right now</span>
        </p>
      </section>

      <section class="col col--ready is-empty" id="colReady">
        <div class="col-head">
          <h2>Ready</h2>
          <span class="count" id="readyCount"></span>
        </div>
        <div class="nums" id="readyNums"></div>
        <p class="empty">
          <img src="/img/star.png" alt="">
          <span>your number appears here when it's yours to take</span>
        </p>
      </section>
    </main>

    <footer><span id="status"></span></footer>
  </div>

<script>
(function(){
  'use strict';

  /* ---- Paste the /exec URL of the counter Apps Script deployment here ---- */
  var COUNTER_URL = 'https://script.google.com/macros/s/AKfycbyYM0PQ5VocCmTCpSvFmcao0DnqiUfZy5DFWDlQVJwVkLKNBlaDHb2Iadr4Z9Sb5bjLDw/exec';

  var POLL_MS      = 5000;              // how often we ask the sheet
  var HOLD_MS      = 10 * 60 * 1000;    // a ready number stays up this long
  var STALE_MS     = 45 * 1000;         // no answer for this long = say so
  var SEEN_KEY     = 'gm_counter_ready_seen';

  var prepNums   = document.getElementById('prepNums');
  var readyNums  = document.getElementById('readyNums');
  var prepCount  = document.getElementById('prepCount');
  var readyCount = document.getElementById('readyCount');
  var colPrep    = document.getElementById('colPreparing');
  var colReady   = document.getElementById('colReady');
  var statusEl   = document.getElementById('status');

  var lastOk = 0;

  // When each ready number was first seen ready, so it can drop off by itself.
  // Kept in the tablet rather than the sheet — the barista ticks once and the
  // board tidies up after them. Survives a reload of the page.
  function loadSeen(){
    try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveSeen(seen){
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch(e){}
  }

  function holdReady(ready){
    var now  = Date.now();
    var seen = loadSeen();
    var live = {};

    ready.forEach(function(n){
      live[n] = true;
      if (!seen[n]) seen[n] = now;
    });
    // Forget anything the barista has un-ticked, or that is long gone.
    Object.keys(seen).forEach(function(n){
      if (!live[n] || now - seen[n] > 2 * 60 * 60 * 1000) delete seen[n];
    });
    saveSeen(seen);

    return ready.filter(function(n){ return now - seen[n] < HOLD_MS; });
  }

  // Add and remove only what changed, so numbers already on the board don't
  // blink every five seconds.
  function paint(box, nums){
    var wanted = {};
    nums.forEach(function(n){ wanted[n] = true; });

    Array.prototype.slice.call(box.children).forEach(function(el){
      if (!wanted[el.dataset.n]) el.remove();
    });

    var have = {};
    Array.prototype.slice.call(box.children).forEach(function(el){
      have[el.dataset.n] = el;
    });

    nums.forEach(function(n, i){
      var el = have[n];
      if (!el){
        el = document.createElement('div');
        el.className = 'num';
        el.dataset.n = n;
        el.textContent = n;
      }
      if (box.children[i] !== el) box.insertBefore(el, box.children[i] || null);
    });
  }

  function render(preparing, ready){
    paint(prepNums, preparing);
    paint(readyNums, ready);

    prepCount.textContent  = preparing.length || '';
    readyCount.textContent = ready.length || '';

    colPrep.classList.toggle('is-empty', preparing.length === 0);
    colReady.classList.toggle('is-empty', ready.length === 0);
  }

  function stamp(){
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function setStatus(){
    if (!lastOk){ statusEl.textContent = 'connecting…'; return; }
    var stale = Date.now() - lastOk > STALE_MS;
    statusEl.textContent = stale ? 'reconnecting…' : 'updated ' + stamp();
    statusEl.className = stale ? 'stale' : '';
  }

  async function tick(){
    try {
      var res  = await fetch(COUNTER_URL + '?t=' + Date.now(), { cache:'no-store' });
      var data = await res.json();
      if (data && data.ok){
        render(data.preparing || [], holdReady(data.ready || []));
        lastOk = Date.now();
      }
    } catch(e){
      // Leave the last good board up; a blank screen would read as "all done".
    }
    setStatus();
  }

  // Tablets sleep. Ask them not to, and ask again when they wake.
  var lock = null;
  async function keepAwake(){
    try {
      if ('wakeLock' in navigator && !lock){
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', function(){ lock = null; });
      }
    } catch(e){}
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible'){ keepAwake(); tick(); }
  });

  keepAwake();
  tick();
  setInterval(tick, POLL_MS);
})();
</script>
</body>
</html>
