<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gens Matcha</title>
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="../img/star.png" />
  <meta name="theme-color" content="#FFFDF7" />
  <style>
    @font-face{
      font-family:'Brandon Grotesque';
      src:url("../fonts/Gen's Matcha Regular.woff2") format('woff2');
      font-weight:400; font-style:normal; font-display:swap;
    }
    @font-face{
      font-family:'Brandon Grotesque';
      src:url("../fonts/Gen's Matcha Bold.woff2") format('woff2');
      font-weight:700; font-style:normal; font-display:swap;
    }

    :root{
      --cream:#FFFDF7; --card:#FFFFFF; --brown:#4A3324;
      --green-deep:#357A52; --green-soft:#8FA894;
      --line:#E7ECE3; --tint:#F1F7F1;
      --star:#F6E17E; --radius:10px;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{
      margin:0; background:var(--cream); color:var(--green-deep);
      font:16px/1.55 'Brandon Grotesque', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      -webkit-font-smoothing:antialiased; overflow-x:hidden;
    }
    .wrap{max-width:1080px; margin:auto; padding:32px 28px; position:relative; z-index:1}


    /* ---------- Outlet picker ---------- */
    #picker{ display:none; min-height:100vh; padding:48px 24px 96px; text-align:center; position:relative; z-index:1; }
    #picker .pk-logo{ width:100%; max-width:260px; height:auto; display:block; margin:0 auto 8px; }
    #picker .pk-tag{ color:var(--green-soft); font-style:italic; margin:0 0 34px; }
    #picker .pk-head{ font-style:italic; font-size:20px; color:var(--brown); margin:0 0 30px; }

    /* Luggage tags: one paper tag per outlet, pinned with that outlet's craft
       star button, with a rubber-stamp OPEN mark. */
    #picker .pk-list{ display:flex; justify-content:center; gap:18px; margin:0 auto 30px; flex-wrap:wrap; }
    .pk-card{ appearance:none; font-family:inherit; cursor:pointer; position:relative;
      width:156px; padding:30px 12px 18px; border-radius:3px;
      background:#FBF3E4; border:1.5px dashed #C9B89A; color:var(--brown);
      display:flex; flex-direction:column; align-items:center; gap:2px;
      transition:transform .2s ease, box-shadow .2s ease, background .2s ease; }
    .pk-card[data-id="punggol"]{ transform:rotate(-3deg); }
    .pk-card[data-id="holland"]{ transform:rotate(2.5deg); }
    .pk-card .pk-pin{ position:absolute; top:-15px; left:50%; width:32px; height:auto; margin-left:-16px; }
    .pk-card .pk-name{ font-weight:700; font-size:22px; letter-spacing:.03em; }
    .pk-card .pk-addr{ font-size:12px; color:#9C8B72; line-height:1.35; text-align:center; }
    .pk-card .pk-stamp{ margin-top:12px; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
      color:#D9678F; border:2px solid currentColor; border-radius:2px; padding:2px 9px; transform:rotate(-6deg); }
    @media (hover:hover) and (pointer:fine){ .pk-card:not(:disabled):hover{ border-color:#A8957A; } }
    .pk-card[aria-pressed="true"]{ background:#fff; border-style:solid; border-color:var(--green-deep);
      box-shadow:0 8px 16px rgba(74,51,36,.14); }
    .pk-card[data-id="punggol"][aria-pressed="true"]{ transform:rotate(-3deg) translateY(-4px); }
    .pk-card[data-id="holland"][aria-pressed="true"]{ transform:rotate(2.5deg) translateY(-4px); }
    .pk-card:focus{ outline:none; }
    .pk-card:focus-visible{ outline:2px solid var(--green-deep); outline-offset:4px; }
    /* Closed: still there so they know it exists, clearly not pickable */
    .pk-card:disabled{ cursor:not-allowed; opacity:.5; filter:grayscale(.8); }
    .pk-card:disabled .pk-stamp{ color:var(--green-soft); font-size:10px; letter-spacing:.06em; }
    /* Coming soon: greyed right out, stamp reads COMING SOON */
    .pk-card.soon:disabled{ opacity:.45; filter:grayscale(1); }
    .pk-card.soon .pk-stamp{ color:#9C8B72; font-size:11px; letter-spacing:.1em; }
    @media (prefers-reduced-motion:reduce){ .pk-card{ transition:none; } }

    /* Each tag sits in a slot so a closed outlet can carry a "see dates" link under it */
    .pk-slot{ display:flex; flex-direction:column; align-items:center; gap:14px; }
    .pk-more{ appearance:none; background:none; border:0; padding:2px 4px; cursor:pointer;
      font-family:inherit; font-size:14px; font-style:italic; color:var(--brown);
      text-decoration:underline; text-underline-offset:3px; text-decoration-color:#C9B89A; }
    .pk-more:hover{ text-decoration-color:var(--brown); }
    .pk-more:focus{ outline:none; }
    .pk-more:focus-visible{ outline:2px solid var(--green-deep); outline-offset:3px; border-radius:3px; }

    /* The dates panel: same chips and calendar menu as the closed screen */
    #pkDates{ max-width:560px; margin:0 auto 30px; padding:4px 0 0; text-align:center; }
    #pkDates[hidden]{ display:none; }
    #pkDates .pk-dates-name{ font-weight:700; font-size:17px; color:var(--brown); margin:0; }
    #pkDates .pk-dates-addr{ font-size:13px; color:var(--green-soft); margin:2px 0 0; }
    #pkDates .schedule{ margin-top:18px; }

    #pkEnter{ appearance:none; font-family:inherit; font-weight:700; font-size:17px; cursor:pointer;
      background:var(--green-deep); color:var(--cream); border:1px solid var(--green-deep); border-radius:3px;
      padding:14px 44px; min-width:220px; transition:background .15s ease, opacity .15s ease; }
    #pkEnter:hover:not(:disabled){ background:#2c6644; }
    #pkEnter:disabled{ opacity:.4; cursor:not-allowed; }
    #picker .pk-hint{ font-size:13px; color:var(--green-soft); margin:12px 0 0; min-height:1.2em; }

    /* ---------- Both closed: pick whose dates to see ---------- */
    /* Each outlet is its own star (Punggol yellow, Holland purple). The chosen
       one is in full colour; the other sits back in grey. */
    #closedOverlay .co-switch{ display:flex; justify-content:center; gap:36px; margin:30px 0 0; }
    #closedOverlay .co-switch button{ appearance:none; background:none; border:0; padding:0; cursor:pointer;
      font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--green-soft); }
    #closedOverlay .co-switch img{ width:78px; height:auto; filter:grayscale(1); opacity:.4;
      transform:scale(.85) rotate(-8deg); transition:transform .2s ease, filter .2s ease, opacity .2s ease; }
    #closedOverlay .co-switch span{ font-weight:700; font-size:16px; letter-spacing:.04em;
      padding-bottom:2px; border-bottom:2px solid transparent; }
    #closedOverlay .co-switch button[aria-pressed="true"]{ color:var(--green-deep); }
    #closedOverlay .co-switch button[aria-pressed="true"] img{ filter:none; opacity:1; transform:scale(1.1) rotate(6deg); }
    #closedOverlay .co-switch button[aria-pressed="true"] span{ border-bottom-color:var(--green-deep); }
    @media (hover:hover) and (pointer:fine){
      #closedOverlay .co-switch button[aria-pressed="false"]:hover img{ opacity:.7; }
    }
    #closedOverlay .co-switch button:disabled{ cursor:default; }
    #closedOverlay .co-switch button:disabled img{ opacity:.3; transform:scale(.8) rotate(-8deg); }
    #closedOverlay .co-switch .co-soon{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
      border:0; padding:0; color:#9C8B72; }
    #closedOverlay .co-switch button:focus{ outline:none; }
    #closedOverlay .co-switch button:focus-visible{ outline:2px solid var(--green-deep); outline-offset:4px; border-radius:6px; }
    /* Address sits under the outlet name, level with Holland's COMING SOON */
    #closedOverlay .co-switch{ align-items:flex-start; }
    #closedOverlay .co-switch button .co-baddr,
    #closedOverlay .co-switch button[aria-pressed="true"] .co-baddr{ font-size:11px; font-weight:400; letter-spacing:.02em;
      color:var(--green-soft); border:0; padding:0; margin-top:2px; white-space:nowrap; }
    #closedOverlay .schedule[hidden]{ display:none; }
    #closedOverlay .schedule{ margin-top:26px; }
  </style>
  <style>
    #closedOverlay{ position:fixed; inset:0; z-index:9998; display:none; opacity:0;
      transition:opacity .5s ease; background:var(--cream); overflow:auto;
      overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
      align-items:flex-start; justify-content:center; padding:56px 24px 96px; text-align:center; }
    #closedOverlay .co-container{ max-width:600px; width:100%; position:relative; z-index:1; }
    #closedOverlay .co-icon{ width:210px; max-width:60vw; height:auto; display:block; margin:0 auto 28px; }
    #closedOverlay .co-message{ font-size:19px; color:var(--green-soft); line-height:1.6; margin:0 auto 12px; max-width:44ch; }
    #closedOverlay .co-logo{ position:fixed; bottom:22px; left:26px; width:120px; height:auto; z-index:2; }

    /* which outlet is closed, and where else they can go */
    #closedOverlay .co-outlet{ display:inline-block; font-weight:700; text-transform:uppercase; letter-spacing:.12em;
      font-size:13px; color:var(--green-deep); background:var(--tint); border:1px solid var(--line);
      border-radius:999px; padding:5px 14px; margin:0 0 14px; }
    #closedOverlay .co-other{ margin:22px auto 0; max-width:420px; background:var(--tint); border:1px solid var(--green-deep);
      border-radius:var(--radius); padding:16px 18px; }
    #closedOverlay .co-other[hidden]{ display:none; }
    #closedOverlay .co-other p{ margin:0 0 10px; font-size:15px; color:var(--green-deep); }
    #closedOverlay .co-other a{ display:inline-block; background:var(--green-deep); color:var(--cream); text-decoration:none;
      font-weight:700; font-size:15px; border-radius:3px; padding:10px 20px; }
    #closedOverlay .co-other a:hover{ background:#2c6644; }
    #closedOverlay .co-back{ display:inline-block; margin-top:26px; font-size:14px; color:var(--green-soft);
      text-decoration:underline; text-underline-offset:3px; }
    #closedOverlay .co-back:hover{ color:var(--green-deep); }

    /* schedule */
    #closedOverlay .schedule{ position:relative; margin:44px auto 0; text-align:center; }
    #closedOverlay .sched-head{ display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap; gap:12px; margin:0 0 4px; }
    #closedOverlay .sched-title{ font-weight:700; text-transform:uppercase; letter-spacing:.12em; font-size:15px; color:var(--green-deep); margin:0; }
    #closedOverlay .sched-rule{ height:1px; background:var(--line); margin:0 0 10px; border:0; }
    #closedOverlay .sched-note{ font-size:14px; color:var(--green-soft); margin:0 0 22px; }
    #closedOverlay #coGroups{ display:flex; flex-direction:column; align-items:center; gap:12px; }
    #closedOverlay .dates{ position:relative; display:flex; flex-wrap:wrap; justify-content:center; gap:10px 18px; animation:schedFade .45s ease both; }   /* one week per row */

    /* loading state */
    #closedOverlay .schedule.loading .sched-note{ display:none; }
    #closedOverlay .schedule:not(.loading) .sched-note{ animation:schedFade .4s ease both; }
    #closedOverlay .sched-loading{ display:flex; align-items:center; justify-content:center; gap:9px;
      color:var(--green-soft); font-size:14px; padding:20px 0 4px; animation:schedFade .4s ease both; }
    #closedOverlay .sched-loading .dots{ display:inline-flex; gap:5px; }
    #closedOverlay .sched-loading .dots i{ width:10px; height:10px; display:inline-block;
      clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation:schedStar 1s infinite ease-in-out both; }
    #closedOverlay .sched-loading .dots i:nth-child(1){ background:#E58AB0; }
    #closedOverlay .sched-loading .dots i:nth-child(2){ background:#6FA96B; animation-delay:.15s; }
    #closedOverlay .sched-loading .dots i:nth-child(3){ background:#6FA5C9; animation-delay:.30s; }
    @keyframes schedStar{ 0%,80%,100%{ opacity:.3; transform:translateY(0) rotate(0deg); } 40%{ opacity:1; transform:translateY(-5px) rotate(12deg); } }
    @keyframes schedFade{ from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion: reduce){
      #closedOverlay .dates, #closedOverlay .sched-loading{ animation:none; }
      #closedOverlay .sched-loading .dots i{ animation-duration:1.6s; }
    }

    #closedOverlay .date{ display:inline-flex; align-items:center; gap:8px; appearance:none; cursor:pointer;
      background:none; color:var(--green-deep); border:0; border-bottom:2px solid transparent; border-radius:0;
      padding:6px 4px; font-family:inherit; font-size:15px; font-weight:700; transition:border-color .15s ease, color .15s ease; }
    @media (hover:hover) and (pointer:fine){ #closedOverlay .date:hover{ border-bottom-color:var(--green-soft); } }
    #closedOverlay .date:focus{ outline:none; }
    #closedOverlay .date:focus-visible{ outline:2px solid var(--green-deep); outline-offset:3px; border-radius:4px; }
    #closedOverlay .date .cal-ico{ width:18px; height:18px; object-fit:contain; flex:none; }
    #closedOverlay .date[aria-expanded="true"]{ border-bottom-color:var(--green-deep); }
    #closedOverlay .date.next{ border-bottom-color:var(--green-deep); }
    #closedOverlay .date.past{ color:var(--green-soft); opacity:.5; cursor:default; text-decoration:line-through; }
    #closedOverlay .date.past .cal-ico{ opacity:.6; }

    #closedOverlay .cal-menu{ position:absolute; top:calc(100% + 6px); left:0; z-index:20; min-width:200px;
      background:var(--cream); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:0 6px 18px rgba(74,51,36,.10); padding:6px; display:none; text-align:left; }
    #closedOverlay .cal-menu.open{ display:block; }
    #closedOverlay .cal-menu-title{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--green-soft); padding:6px 8px 4px; }
    #closedOverlay .cal-opt{ display:flex; align-items:center; gap:9px; width:100%; background:none; border:0; border-radius:2px;
      padding:9px 8px; font-family:inherit; font-size:14px; font-weight:400; color:var(--green-deep); text-align:left; cursor:pointer; text-decoration:none; }
    @media (hover:hover) and (pointer:fine){ #closedOverlay .cal-opt:hover{ background:#F0F4EC; } }
    #closedOverlay .cal-opt svg{ width:15px; height:15px; color:var(--green-soft); flex:none; }

    /* tele */
    #closedOverlay .tele-wrap{ margin:40px 0 0; }
    #closedOverlay .tele-lead{ font-size:15px; color:var(--green-deep); margin:0 0 4px; }
    #closedOverlay .tele-psst{ font-size:13px; font-style:italic; color:var(--green-soft); margin:0 0 16px; }
    #closedOverlay .co-tele{ display:inline-flex; align-items:center; gap:10px; border:1px solid var(--green-deep);
      border-radius:3px; padding:14px 28px; background:var(--green-deep); color:var(--cream);
      font-family:inherit; font-weight:700; font-size:17px; cursor:pointer; text-decoration:none; transition:background .15s ease; }
    #closedOverlay .co-tele:hover{ background:#2c6644; border-color:#2c6644; }
    #closedOverlay .co-confetti{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }

    /* star confetti (shared) */
    .bg-confetti{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
    .bg-confetti svg, #closedOverlay .co-confetti svg{ position:absolute; opacity:.5; }

    @media (max-width:600px){
      #closedOverlay{ padding:40px 20px 88px; }
      #closedOverlay .co-icon{ width:170px; margin-bottom:24px; }
      #closedOverlay .co-message{ font-size:17px; }
      #closedOverlay .co-logo{ width:88px; bottom:14px; left:20px; }
      #closedOverlay .schedule{ margin-top:34px; }
      #closedOverlay .sched-note{ margin-bottom:28px; }
      #closedOverlay #coGroups{ gap:20px; }
      #closedOverlay .dates{ gap:10px 16px; }
      #closedOverlay .date{ padding:8px 6px; font-size:16px; }
      #closedOverlay .tele-wrap{ margin-top:44px; }
      .bg-confetti svg, #closedOverlay .co-confetti svg{ opacity:.42; }
    }
  </style>

    #pkDates .cal-opt svg{ width:15px; height:15px; color:var(--green-soft); flex:none; }

</style>
  <style>
    /* Splash: "just a moment" with the same hopping stars as the dates loader, shown from the start */
    .splash-wait{ display:flex; align-items:center; justify-content:center; gap:9px; font-size:14px; color:#7E9B85;
      font-family:inherit; animation:schedFade .4s ease both; }
    .splash-wait .dots{ display:inline-flex; gap:5px; }
    .splash-wait .dots i{ width:10px; height:10px; display:inline-block;
      clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation:schedStar 1s infinite ease-in-out both; }
    .splash-wait .dots i:nth-child(1){ background:#E58AB0; }
    .splash-wait .dots i:nth-child(2){ background:#6FA96B; animation-delay:.15s; }
    .splash-wait .dots i:nth-child(3){ background:#6FA5C9; animation-delay:.30s; }
    @media (prefers-reduced-motion: reduce){ .splash-wait{ animation:none; } .splash-wait .dots i{ animation-duration:1.6s; } }
  </style>
</head>
<body>
  <div id="loadingSplash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;background:#FFFDF7;opacity:1;transition:opacity .45s ease;">
    <img src="../img/Logo-Open.png" alt="Gens Matcha" style="width:60%;max-width:240px;height:auto;opacity:.9;">
    <div class="splash-wait" role="status">just a moment<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
  </div>

  <div class="bg-confetti" aria-hidden="true"></div>

  <!-- One or both outlets open: choose, then Enter -->
  <main id="picker">
    <img class="pk-logo" src="../img/Logo-Open.png" alt="Gens Matcha">
    <p class="pk-tag">whisked by hand · made with care</p>
    <h1 class="pk-head">pick up from…</h1>
    <div class="pk-list" id="pkList" role="group" aria-label="Outlets"></div>
    <section id="pkDates" hidden aria-live="polite">
      <p class="pk-dates-name" id="pkDatesName"></p>
      <p class="pk-dates-addr" id="pkDatesAddr"></p>
      <div class="schedule loading">
        <div class="sched-head"><h2 class="sched-title">Opening dates</h2></div>

  <!-- Both outlets closed -->
  <div id="closedOverlay" aria-hidden="true">

  <script src="outlets.js"></script>
  <script>
  (function(){
    var APPS_SCRIPT_URL = GM.SCRIPT_URL;   // set in outlets.js
    var LAST_KEY = 'gm_last_outlet_v1';   // preselects their usual outlet when both are open

    var splash = document.getElementById('loadingSplash');
    function hideSplash(){ splash.style.opacity = '0'; setTimeout(function(){ splash.style.display = 'none'; }, 450); }

    // Same patience as the outlet pages: a cold Apps Script can take a few seconds.
    function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
    async function statusOnce(ms){
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, ms) : null;
      try {
        var res = await fetch(APPS_SCRIPT_URL + '?t=' + Date.now(),
          ctrl ? { method:'GET', cache:'no-store', signal: ctrl.signal } : { method:'GET', cache:'no-store' });
        return await res.json();
      } finally { if(timer) clearTimeout(timer); }
    }
    function isAnswer(d){ return !!d && (d.ok === true || (d.ok === undefined && typeof d.open === 'boolean')); }
    async function getStatus(){
      var tries = [{ t:6000, w:0 }, { t:5000, w:400 }, { t:5000, w:900 }], started = Date.now();
      for(var i = 0; i < tries.length; i++){
        if(tries[i].w) await sleep(tries[i].w);
        var left = 13000 - (Date.now() - started);
        if(left <= 0) break;
        try { var d = await statusOnce(Math.min(tries[i].t, left)); if(isAnswer(d)) return d; } catch(e){}
      }
      return null;
    }


    function showPicker(st){
      var list = document.getElementById('pkList');
      var enter = document.getElementById('pkEnter');
      var hint = document.getElementById('pkHint');
      var chosen = null;
      var openIds = GM.ORDER.filter(function(id){ return st.outlets[id].open; });
      var last = null; try { last = localStorage.getItem(LAST_KEY); } catch(e){}

      function select(id){
        chosen = id;
        list.querySelectorAll('.pk-card').forEach(function(c){
          c.setAttribute('aria-pressed', String(c.dataset.id === id));
        });
        enter.disabled = !id;
        enter.textContent = id ? 'Enter ' + GM.OUTLETS[id].name : 'Enter';
        hint.textContent = '';
      }

      GM.ORDER.forEach(function(id){
        var o = GM.OUTLETS[id], open = st.outlets[id].open, soon = !!o.comingSoon;
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pk-card' + (soon ? ' soon' : ''); b.dataset.id = id;
        b.setAttribute('aria-pressed', 'false');
        b.disabled = !open;
        b.innerHTML = '<img class="pk-pin" src="' + GM.ROOT + 'img/' + o.pin + '" alt="">'
          + '<span class="pk-name">' + o.name + '</span>'
          + '<span class="pk-addr">' + o.short + '</span>'
          + '<span class="pk-stamp">' + (soon ? 'Coming soon' : open ? 'Open' : GM.backLabel(st.outlets[id].dates)) + '</span>';
        b.setAttribute('aria-label', o.name + ', ' + o.address + ', '
          + (soon ? 'coming soon' : open ? 'open now' : 'closed. ' + GM.nextOpenLabel(st.outlets[id].dates)));
        b.addEventListener('click', function(){ if(!b.disabled) select(id); });
        b.addEventListener('dblclick', function(){ if(!b.disabled){ select(id); go(); } });

        var slot = document.createElement('div');
        slot.className = 'pk-slot';
        slot.appendChild(b);
        if(!open && !soon){
          // Closed: the stamp only says the next date, so offer the rest.
          var more = document.createElement('button');
          more.type = 'button'; more.className = 'pk-more';
          more.setAttribute('aria-controls', 'pkDates');
          more.setAttribute('aria-expanded', 'false');
          more.textContent = 'show dates';
          more.addEventListener('click', function(){ toggleDates(id, more); });
          slot.appendChild(more);
        }
        list.appendChild(slot);
      });

      // ---- "see dates" panel (only ever one closed outlet on this screen) ----
      var panel = document.getElementById('pkDates');
      var panelFor = null, schedFor = {};
      function toggleDates(id, btn){
        var o = GM.OUTLETS[id];
        var opening = panel.hidden || panelFor !== id;
        panel.hidden = !opening;
        btn.setAttribute('aria-expanded', String(opening));
        btn.textContent = opening ? 'hide dates' : 'show dates';
        if(!opening){ panelFor = null; return; }
        panelFor = id;
        document.getElementById('pkDatesName').textContent = o.name;
        document.getElementById('pkDatesAddr').textContent = o.address;
        if(!schedFor[id]){
          var sec = panel.querySelector('.schedule');
          schedFor[id] = GM.makeSchedule(o, {
            groupsEl: sec.querySelector('.co-groups'),
            titleEl: sec.querySelector('.sched-title'),
            noteEl: sec.querySelector('.sched-note'),
            sectionEl: sec
          });
          schedFor[id].render(st.outlets[id].dates);
        }
      }

      // One open: it is the only choice, so pick it for them.
      // Both open: preselect the one they used last time, if any.
      if(openIds.length === 1) select(openIds[0]);
      else if(last && openIds.indexOf(last) !== -1) select(last);
      else hint.textContent = 'Both outlets are open, pick one to order from.';

      function go(){
        if(!chosen) return;
        try { localStorage.setItem(LAST_KEY, chosen); } catch(e){}
        // Hand the status we just fetched to the outlet page so it can skip its splash.
        try { sessionStorage.setItem('gm_status_handoff_v1', JSON.stringify({ at: Date.now(), st: st })); } catch(e){}
        location.href = GM.href(GM.OUTLETS[chosen].path);
      }
      enter.addEventListener('click', go);
      document.getElementById('picker').style.display = 'block';
    }

    function showBothClosed(st){
      var ov = document.getElementById('closedOverlay');
      var sw = document.getElementById('coSwitch');
      var holder = document.getElementById('coSchedules');
      var sections = {};

      GM.ORDER.forEach(function(id){
        if(GM.OUTLETS[id].comingSoon){
          var s = document.createElement('button');
          s.type = 'button'; s.disabled = true; s.dataset.id = id;
          s.setAttribute('aria-label', GM.OUTLETS[id].name + ', coming soon');
          s.innerHTML = '<img src="' + GM.ROOT + 'img/' + GM.OUTLETS[id].star + '" alt=""><span>' + GM.OUTLETS[id].name
            + '</span><span class="co-soon">Coming soon</span>';
          sw.appendChild(s);
          return;
        }
        var sec = document.createElement('section');
        sec.className = 'schedule loading';
        sec.setAttribute('aria-label', GM.OUTLETS[id].name + ' opening dates');
        sec.innerHTML = '<div class="sched-head"><h2 class="sched-title">Opening dates</h2></div>'
          + '<hr class="sched-rule"><p class="sched-note"></p><div class="co-groups" style="display:flex;flex-direction:column;align-items:center;gap:12px"></div>';
        holder.appendChild(sec);
        sections[id] = sec;
        GM.makeSchedule(GM.OUTLETS[id], {
          groupsEl: sec.querySelector('.co-groups'),
          titleEl: sec.querySelector('.sched-title'),
          noteEl: sec.querySelector('.sched-note'),
          sectionEl: sec
        }).render(st.outlets[id].dates);

        var b = document.createElement('button');
        b.type = 'button'; b.dataset.id = id;
        b.setAttribute('aria-label', 'Opening dates for ' + GM.OUTLETS[id].name);
        b.innerHTML = '<img src="' + GM.ROOT + 'img/' + GM.OUTLETS[id].star + '" alt=""><span>' + GM.OUTLETS[id].name + '</span>'
          + '<span class="co-baddr">' + GM.OUTLETS[id].address + '</span>';
        b.addEventListener('click', function(){ pick(id); });
        sw.appendChild(b);
      });

      function pick(id){
        Object.keys(sections).forEach(function(k){ sections[k].hidden = (k !== id); });
        sw.querySelectorAll('button:not(:disabled)').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.id === id)); });
        try { localStorage.setItem(LAST_KEY, id); } catch(e){}
      }
      var last = null; try { last = localStorage.getItem(LAST_KEY); } catch(e){}
      pick(sections[last] ? last : Object.keys(sections)[0]);

      ov.style.display = 'flex'; ov.style.opacity = '1';
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
    }

    (async function(){
      var raw = await getStatus();
      var st = GM.normalizeStatus(raw);
      var anyOpen = GM.ORDER.some(function(id){ return st.outlets[id].open; });
      if(anyOpen) showPicker(st); else showBothClosed(st);
      hideSplash();
    })();
  })();
  </script>

  <script>
  // ============= Star confetti =============
  (function(){

    // [position css, fill, size, rotation]
    var CONFETTI = [
      ["top:3%;left:41%","#6FA5C9",10,-8],["top:4%;right:39%","#E8734A",11,12],
      ["top:6%;left:15%","#E8734A",15,-15],["top:9%;right:16%","#6FA5C9",13,12],
      ["top:17%;left:25%","#C3D46A",12,20],["top:15%;right:26%","#E58AB0",11,-8],
      ["top:27%;left:6%","#6FA5C9",12,6],["top:24%;right:7%","#F0A04B",15,-18],
      ["top:38%;left:23%","#E58AB0",12,14],["top:37%;right:22%","#6FA96B",13,-10],
      ["top:50%;left:8%","#E58AB0",14,8],["top:48%;right:10%","#E8734A",18,16],
      ["top:62%;left:20%","#6FA96B",12,-12],["top:60%;right:18%","#C3D46A",12,10],
      ["top:74%;left:10%","#F0A04B",13,14],["top:72%;right:24%","#E58AB0",13,-16],
      ["top:85%;left:26%","#6FA5C9",12,-10],["top:84%;right:14%","#F0A04B",14,18],
      ["bottom:5%;left:44%","#E58AB0",12,-12],["bottom:6%;right:40%","#C3D46A",11,14]
    ];
    // sparser, balanced layout for narrow screens (top + bottom bands, slim side edges)
    var CONFETTI_MOBILE = [
      ["top:2%;left:8%","#E8734A",12,-12],["top:3%;right:10%","#6FA5C9",12,12],
      ["top:4%;left:31%","#C3D46A",10,18],["top:5%;right:29%","#E58AB0",10,-8],
      ["top:40%;left:3%","#6FA96B",11,8],["top:43%;right:3%","#F0A04B",11,-14],
      ["top:60%;left:4%","#E58AB0",11,10],["top:58%;right:4%","#6FA5C9",11,-10],
      ["bottom:4%;left:14%","#F0A04B",12,14],["bottom:5%;right:16%","#E8734A",12,-16],
      ["bottom:7%;left:40%","#C3D46A",10,-10],["bottom:6%;right:38%","#E58AB0",10,16]
    ];
    var list = (window.matchMedia && window.matchMedia("(max-width:600px)").matches) ? CONFETTI_MOBILE : CONFETTI;
    function paint(el){
      if(!el) return;
      el.innerHTML = list.map(function(c){
        return '<svg style="' + c[0] + ';width:' + c[2] + 'px;height:' + c[2]
          + 'px;transform:rotate(' + c[3] + 'deg)" viewBox="0 0 24 24" fill="' + c[1]
          + '"><path d="' + STAR_PATH + '"/></svg>';
      }).join("");
    }
    document.querySelectorAll('.bg-confetti, #closedOverlay .co-confetti').forEach(paint);
  })();
  </script>
