<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Collection — Gens Matcha × Natura</title>

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/img/star.png" />
  <meta name="theme-color" content="#FFFDF7" />
  <!-- Added to the home screen, the board launches with no browser chrome at
       all. This is the dependable route on an iPad, where the Fullscreen API
       is unreliable, and it survives a reboot. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Collection" />
  <link rel="apple-touch-icon" href="/img/star.png" />
  <meta name="robots" content="noindex" />

  <style>
    @font-face{
      font-family:'Brandon Grotesque';
      src:url("/fonts/Gen's Matcha Regular.woff2") format('woff2');
      font-weight:400; font-style:normal; font-display:swap;
    }
    @font-face{
      font-family:'Brandon Grotesque';
      src:url("/fonts/Gen's Matcha Bold.woff2") format('woff2');
      font-weight:700; font-style:normal; font-display:swap;
    }

    /* Blues taken from the Natura wordmark (#8BD6EB), darkened for type. */
    :root{
      --cream:#FFFDF7;
      --blue-logo:#8BD6EB;
      --blue-deep:#166D85;
      --blue-mid:#37A1BE;
      --blue-soft:#91BDCA;
      --line:#DBECF1;
      --tint:#EBF6F8;
    }

    *,*::before,*::after{ box-sizing:border-box }

    html,body{ height:100% }
    body{
      margin:0; background:var(--cream); color:var(--blue-deep);
      font:16px/1.5 'Brandon Grotesque', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      -webkit-font-smoothing:antialiased;
      overflow:hidden; user-select:none; -webkit-user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    .board{
      height:100dvh; display:flex; flex-direction:column;
      padding:22px 30px 12px;
    }

    header{ flex:0 0 auto; text-align:center; padding-bottom:22px }
    .logo{ max-height:164px; width:auto; max-width:88%; display:inline-block }

    .cols{
      flex:1 1 auto; min-height:0;
      display:grid; grid-template-columns:1fr 1fr;
    }
    .col{ display:flex; flex-direction:column; min-height:0; padding:0 28px }
    .col + .col{ border-left:1px solid var(--line) }

    .col-head{
      flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between;
      gap:12px; padding-bottom:9px; margin-bottom:22px;
      border-bottom:1px solid var(--line);
    }
    .col-head h2{
      margin:0; font-size:22px; font-weight:700;
      text-transform:uppercase; letter-spacing:.14em;
      color:var(--blue-deep);
    }
    .col--preparing .col-head h2{ color:var(--blue-mid) }
    .count{ font-size:15px; color:var(--blue-soft); font-variant-numeric:tabular-nums }

    /* A grid, not wrapped flex, so every number sits in an identical box —
       the wordmark's figures aren't tabular, so free-width chips came out
       uneven. */
    .nums{
      flex:1 1 auto; min-height:0; overflow-y:auto;
      display:grid; align-content:start; gap:14px;
      scrollbar-width:none;
    }
    .nums::-webkit-scrollbar{ display:none }
    .col--preparing .nums{ grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)) }
    .col--ready .nums{ grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)) }

    .num{
      display:flex; align-items:center; justify-content:center;
      font-weight:700; letter-spacing:.02em;
      border-radius:10px; animation:rise .4s ease backwards;
    }

    .col--preparing .num{
      padding:12px 8px;
      font-size:clamp(32px, 4.2vw, 54px);
      color:var(--blue-mid); background:var(--cream);
      border:1px solid var(--line);
    }
    .col--ready .num{
      padding:14px 8px;
      font-size:clamp(38px, 5.2vw, 66px);
      color:var(--cream); background:var(--blue-deep);
      border:1px solid var(--blue-deep);
    }

    .empty{
      flex:1 1 auto; display:none; flex-direction:column;
      align-items:center; justify-content:center; gap:12px;
      margin:0; padding-bottom:8%;
      color:var(--blue-soft); font-size:15px; text-align:center;
    }
    .empty img{ width:40px; height:auto; opacity:.5 }
    .is-empty .nums{ display:none }
    .is-empty .empty{ display:flex }

    footer{
      flex:0 0 auto; padding-top:10px; text-align:right;
      font-size:12px; color:var(--blue-soft); letter-spacing:.04em;
      min-height:22px;
    }
    .stale{ color:#B85C3C }

    /* Browsers refuse to play audio until someone has touched the page, so the
       board asks once. Removed for good the moment the tablet is tapped. */
    /* Always available, deliberately faint: the board is a display, not a
       control panel, and nobody should notice this from across the shop. */
    .fs-btn{
      position:fixed; top:10px; right:12px; z-index:60;
      appearance:none; border:1px solid var(--line); background:transparent;
      color:#166D85; opacity:.35; border-radius:999px;
      padding:6px 13px; font:inherit; font-size:13px; font-weight:700;
      cursor:pointer; transition:opacity .15s ease;
    }
    .fs-btn:hover, .fs-btn:focus-visible{ opacity:1; }
    /* Once the board fills the screen there is nothing to escape from, and a
       stray control in the corner only invites a mis-tap. */
    :fullscreen .fs-btn{ display:none; }
    :-webkit-full-screen .fs-btn{ display:none; }

    .sound-hint{
      position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
      background:#166D85; color:#FFFDF7; border-radius:999px;
      padding:9px 18px; font-size:14px; font-weight:700; letter-spacing:.01em;
      box-shadow:0 2px 10px rgba(0,0,0,.12); z-index:50;
    }

    @keyframes rise{ from{ opacity:0; transform:translateY(5px) } }
    @media (prefers-reduced-motion:reduce){ .num{ animation:none } }

    /* Portrait tablet: stack the two lists instead of squeezing them. */
    @media (orientation:portrait){
      .cols{ grid-template-columns:1fr; grid-template-rows:1fr 1fr }
      .col{ padding:0 4px }
      .col + .col{ border-left:0; border-top:1px solid var(--line); padding-top:20px; margin-top:18px }
      .logo{ max-height:120px }
    }
  </style>
</head>
<body>

  <div class="board">
    <header>
      <img class="logo" src="/img/Logo-Open.png" alt="Natura, a partnership with Gen's Matcha">
    </header>

    <main class="cols">
      <section class="col col--preparing is-empty" id="colPreparing">
        <div class="col-head">
          <h2>Preparing</h2>
          <span class="count" id="prepCount"></span>
        </div>
        <div class="nums" id="prepNums"></div>
        <p class="empty">
          <img src="/img/star.png" alt="">
          <span>nothing on the whisk right now</span>
        </p>
      </section>

      <section class="col col--ready is-empty" id="colReady">
        <div class="col-head">
          <h2>Ready</h2>
          <span class="count" id="readyCount"></span>
        </div>
        <div class="nums" id="readyNums"></div>
        <p class="empty">
          <img src="/img/star.png" alt="">
          <span>your number appears here when it's yours to take</span>
        </p>
      </section>
    </main>

    <footer><span id="status"></span></footer>
  </div>

<script>
(function(){
  'use strict';

  /* ---- Paste the /exec URL of the counter Apps Script deployment here ---- */
  var COUNTER_URL = 'https://script.google.com/macros/s/AKfycbyYM0PQ5VocCmTCpSvFmcao0DnqiUfZy5DFWDlQVJwVkLKNBlaDHb2Iadr4Z9Sb5bjLDw/exec';

  var POLL_MS      = 5000;              // how often we ask the sheet
  var HOLD_MS      = 10 * 60 * 1000;    // a ready number stays up this long
  var STALE_MS     = 45 * 1000;         // no answer for this long = say so
  var SEEN_KEY     = 'gm_counter_ready_seen';

  /* Your own chime. Drop the file into /img alongside the pictures and name it
     here. Keep it short (1-3s) and use a format the tablet can read: .mp3,
     .m4a, .wav and .ogg are all safe. Set this to '' to use the built-in chime
     instead. If the file is missing, the wrong format, or fails to load for any
     reason, the board falls back to the built-in chime rather than going
     silent. */
  var SOUND_URL    = '/img/ready.mp3';
  var SOUND_VOLUME = 1;                 // 0 to 1, scales whichever sound plays

  var prepNums   = document.getElementById('prepNums');
  var readyNums  = document.getElementById('readyNums');
  var prepCount  = document.getElementById('prepCount');
  var readyCount = document.getElementById('readyCount');
  var colPrep    = document.getElementById('colPreparing');
  var colReady   = document.getElementById('colReady');
  var statusEl   = document.getElementById('status');

  var lastOk = 0;

  /* ---- The ready chime ----------------------------------------------------
     Synthesised rather than loaded, so there is no audio file to host, no
     second request to fail, and nothing to go missing if the tablet is on a
     bad connection. Three rising notes, short and soft enough to live under
     shop noise without becoming a fire alarm. */
  var actx = null;
  var soundBytes = null;   // the custom file, downloaded but not yet decoded
  var soundBuf   = null;   // ...and decoded, once there is a context to do it

  /* The bytes can be fetched straight away — only DECODING and playing need a
     context, and that waits on the first tap. So by the time anyone touches
     the tablet the file is already here. */
  if (SOUND_URL){
    fetch(SOUND_URL, { cache:'force-cache' })
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(function(b){ soundBytes = b; })
      .catch(function(){ soundBytes = null; });   // fall back to the built-in
  }

  function decodeSound(){
    if (!actx || !soundBytes || soundBuf) return;
    try {
      // Safari wants the callback form, everyone else returns a promise.
      var p = actx.decodeAudioData(
        soundBytes.slice(0),
        function(buf){ soundBuf = buf; },
        function(){}
      );
      if (p && p.then) p.then(function(buf){ soundBuf = buf; }).catch(function(){});
    } catch(e){}
  }

  function playFile(){
    var src  = actx.createBufferSource();
    var gain = actx.createGain();
    gain.gain.value = SOUND_VOLUME;
    src.buffer = soundBuf;
    src.connect(gain).connect(actx.destination);
    src.start();
  }

  // Three rising notes, short and soft enough to live under shop noise
  // without becoming a fire alarm. Used whenever there is no custom file.
  function playBuiltIn(){
    var t0 = actx.currentTime;
    [1046.5, 1318.5, 1568.0].forEach(function(freq, i){
      var at   = t0 + i * 0.09;
      var osc  = actx.createOscillator();
      var gain = actx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.28 * SOUND_VOLUME, at + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.42);
      osc.connect(gain).connect(actx.destination);
      osc.start(at);
      osc.stop(at + 0.45);
    });
  }

  function chime(){
    if (!actx) return;
    if (actx.state === 'suspended') actx.resume();
    if (soundBuf) playFile();
    else playBuiltIn();
  }

  /* Audio is blocked until the page has been touched, so the board says so and
     arms itself on the first tap. One listener, removed once it has fired. */
  /* ---- Full screen ----
     Both the browser chrome and the audio unlock need a real user gesture, so
     the first tap does both at once and the board is set up in one action. */
  var root = document.documentElement;

  function isFull(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function goFull(){
    try {
      var fn = root.requestFullscreen || root.webkitRequestFullscreen;
      if (fn) fn.call(root);
    } catch(e){}   // iPhone Safari has no Fullscreen API; home-screen launch covers it
  }
  function exitFull(){
    try {
      var fn = document.exitFullscreen || document.webkitExitFullscreen;
      if (fn) fn.call(document);
    } catch(e){}
  }

  var fsBtn = document.createElement('button');
  fsBtn.className = 'fs-btn';
  fsBtn.type = 'button';
  fsBtn.textContent = 'Full screen';
  fsBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (isFull()) exitFull(); else goFull();
  });
  document.body.appendChild(fsBtn);

  var hint = document.createElement('div');
  hint.className = 'sound-hint';
  hint.textContent = 'Tap anywhere to start the board';
  document.body.appendChild(hint);

  /* The one setup tap: unlocks audio, hides the browser chrome, and takes the
     prompt away. Runs once, then removes itself so a later stray tap on the
     board does nothing. */
  function armSound(){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !actx) actx = new AC();
      if (actx && actx.state === 'suspended') actx.resume();
      decodeSound();
    } catch(e){}
    goFull();
    if (hint){ hint.remove(); hint = null; }
    document.removeEventListener('pointerdown', armSound);
    document.removeEventListener('keydown', armSound);
  }
  document.addEventListener('pointerdown', armSound);
  document.addEventListener('keydown', armSound);

  /* Numbers that went ready on THIS poll. holdReady already knows which ones
     it has never seen before, so the chime rides on that rather than keeping a
     second list that could drift out of step with it. */
  var freshlyReady = [];

  /* The first answer after a reload seeds the board silently. Without this a
     tablet that refreshes mid-service would chime for every drink already
     sitting on the counter. */
  var soundArmed = false;

  // When each ready number was first seen ready, so it can drop off by itself.
  // Kept in the tablet rather than the sheet — the barista ticks once and the
  // board tidies up after them. Survives a reload of the page.
  function loadSeen(){
    try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveSeen(seen){
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch(e){}
  }

  function holdReady(ready){
    var now  = Date.now();
    var seen = loadSeen();
    var live = {};

    freshlyReady = [];
    ready.forEach(function(n){
      live[n] = true;
      if (!seen[n]){ seen[n] = now; freshlyReady.push(n); }
    });
    // Forget anything the barista has un-ticked, or that is long gone.
    Object.keys(seen).forEach(function(n){
      if (!live[n] || now - seen[n] > 2 * 60 * 60 * 1000) delete seen[n];
    });
    saveSeen(seen);

    return ready.filter(function(n){ return now - seen[n] < HOLD_MS; });
  }

  // Add and remove only what changed, so numbers already on the board don't
  // blink every five seconds.
  function paint(box, nums){
    var wanted = {};
    nums.forEach(function(n){ wanted[n] = true; });

    Array.prototype.slice.call(box.children).forEach(function(el){
      if (!wanted[el.dataset.n]) el.remove();
    });

    var have = {};
    Array.prototype.slice.call(box.children).forEach(function(el){
      have[el.dataset.n] = el;
    });

    nums.forEach(function(n, i){
      var el = have[n];
      if (!el){
        el = document.createElement('div');
        el.className = 'num';
        el.dataset.n = n;
        el.textContent = n;
      }
      if (box.children[i] !== el) box.insertBefore(el, box.children[i] || null);
    });
  }

  function render(preparing, ready){
    paint(prepNums, preparing);
    paint(readyNums, ready);

    prepCount.textContent  = preparing.length || '';
    readyCount.textContent = ready.length || '';

    colPrep.classList.toggle('is-empty', preparing.length === 0);
    colReady.classList.toggle('is-empty', ready.length === 0);
  }

  function stamp(){
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function setStatus(){
    if (!lastOk){ statusEl.textContent = 'connecting…'; return; }
    var stale = Date.now() - lastOk > STALE_MS;
    statusEl.textContent = stale ? 'reconnecting…' : 'updated ' + stamp();
    statusEl.className = stale ? 'stale' : '';
  }

  async function tick(){
    try {
      var res  = await fetch(COUNTER_URL + '?t=' + Date.now(), { cache:'no-store' });
      var data = await res.json();
      if (data && data.ok){
        render(data.preparing || [], holdReady(data.ready || []));
        lastOk = Date.now();
        // One chime per poll, however many numbers turned ready at once.
        if (soundArmed && freshlyReady.length) chime();
        soundArmed = true;
      }
    } catch(e){
      // Leave the last good board up; a blank screen would read as "all done".
    }
    setStatus();
  }

  // Tablets sleep. Ask them not to, and ask again when they wake.
  var lock = null;
  async function keepAwake(){
    try {
      if ('wakeLock' in navigator && !lock){
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', function(){ lock = null; });
      }
    } catch(e){}
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible'){ keepAwake(); tick(); }
  });

  keepAwake();
  tick();
  setInterval(tick, POLL_MS);
})();
</script>
</body>
</html>
